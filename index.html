<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Guide de pêche en mer de Théoule à Cannes, aux îles de Lérins et au large : espèces, techniques, nœuds, zones, règles 2026, carnet de prises, quiz et checklist.">
<meta name="theme-color" content="#F1F5F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06161F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='15.5' fill='%23F1F5F5' stroke='%230F2A3A' stroke-width='2'/%3E%3Cpath d='M17 4.5l3 12.5-3 12.5-3-12.5z' fill='%23B23C25'/%3E%3Cpath d='M4.5 17l12.5-2.2 12.5 2.2-12.5 2.2z' fill='%230F2A3A' opacity='.6'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Pêche Golfe de la Napoule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Concept : une carte marine de poche. Onglets en bas sur téléphone, rail à gauche sur ordinateur,
   titres façon signalétique de port, données (mailles, profondeurs, coordonnées) en mono comme sur une carte SHOM. */
:root{
  --paper:#F1F5F5; --surface:#FFFFFF; --surface-2:#E8EFF1; --surface-3:#DAE6E9;
  --ink:#0F2A3A; --ink-2:#3D5866; --ink-3:#647E8C; --line:#D1DDE1; --line-2:#B3C6CC;
  --lvl-0:#EDF3F4; --lvl-1:#CDE3EC; --lvl-2:#8DBFD4; --lvl-3:#2E7899; --lvl-ink:#FFFFFF;
  --map-sea:#D8EAF1; --map-land:#E9DFC4; --map-land-line:#8F7D57; --map-band:#F0C9D9; --map-grid:#A7C2CD;
  --accent:#B23C25; --accent-soft:#F6E2DC; --on-accent:#FFFFFF;
  --restrict:#A01E5C; --restrict-soft:#F5DFE9; --on-restrict:#FFFFFF;
  --ok:#2A6A4E; --ok-soft:#DCEEE4; --on-ok:#FFFFFF;
  --warn:#835C00; --warn-soft:#F5EACB;
  --shadow:0 1px 2px rgba(15,42,58,.06),0 10px 28px rgba(15,42,58,.08);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#06161F; --surface:#0C2230; --surface-2:#112C3C; --surface-3:#173648;
    --ink:#E2EDF1; --ink-2:#A8BEC8; --ink-3:#8299A5; --line:#1E3B4C; --line-2:#2C4F62;
    --lvl-0:#0F2A38; --lvl-1:#174A60; --lvl-2:#226C8A; --lvl-3:#4BA6C9; --lvl-ink:#04131B;
    --map-sea:#0B2737; --map-land:#2C2A21; --map-land-line:#766C52; --map-band:#3B2738; --map-grid:#24485A;
    --accent:#EB7056; --accent-soft:#3A201B; --on-accent:#1A0A06;
    --restrict:#EA67A2; --restrict-soft:#3A1729; --on-restrict:#1F0612;
    --ok:#63BF94; --ok-soft:#12342A; --on-ok:#03170F;
    --warn:#E3B44E; --warn-soft:#382D12;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#06161F; --surface:#0C2230; --surface-2:#112C3C; --surface-3:#173648;
  --ink:#E2EDF1; --ink-2:#A8BEC8; --ink-3:#8299A5; --line:#1E3B4C; --line-2:#2C4F62;
  --lvl-0:#0F2A38; --lvl-1:#174A60; --lvl-2:#226C8A; --lvl-3:#4BA6C9; --lvl-ink:#04131B;
  --map-sea:#0B2737; --map-land:#2C2A21; --map-land-line:#766C52; --map-band:#3B2738; --map-grid:#24485A;
  --accent:#EB7056; --accent-soft:#3A201B; --on-accent:#1A0A06;
  --restrict:#EA67A2; --restrict-soft:#3A1729; --on-restrict:#1F0612;
  --ok:#63BF94; --ok-soft:#12342A; --on-ok:#03170F;
  --warn:#E3B44E; --warn-soft:#382D12;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
a{color:inherit;text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.05;text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Barre du haut ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1240px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.28rem;text-transform:uppercase;letter-spacing:.05em;line-height:1}
.brand-sub{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.menu-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 11px;font-weight:700;font-size:.9rem;cursor:pointer}

/* ---------- Structure ---------- */
.shell{max-width:1240px;margin:0 auto}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px)}
.view{max-width:820px;display:flex;flex-direction:column;gap:26px}
.sidenav{display:none}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:700;font-size:.95rem}
.navlink:hover{background:var(--surface-2);color:var(--ink)}
.navlink[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav-sep{height:1px;background:var(--line);margin:8px 12px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar-in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));height:var(--nav-h);max-width:640px;margin:0 auto}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--ink-3);font-weight:700;font-size:.66rem;letter-spacing:.01em;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

.sheet{position:fixed;inset:0;z-index:50;background:rgba(4,16,24,.48);display:flex;align-items:flex-end}
.sheet-panel{width:100%;max-height:85vh;overflow:auto;background:var(--paper);border-radius:16px 16px 0 0;padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-head h2{font-size:1.4rem;text-transform:uppercase;letter-spacing:.04em}
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sheet-grid a{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-weight:700}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer}

@media (min-width:960px){
  .shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:12px}
  .sidenav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);align-self:start;max-height:calc(100vh - 76px);overflow:auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .tabbar,.menu-btn{display:none}
  main{padding-block:28px 56px}
}

/* ---------- En-têtes de vue ---------- */
.vh{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.vh h1{font-size:clamp(2.1rem,7vw,3rem);text-transform:uppercase;letter-spacing:.02em}
.vh p{color:var(--ink-2);max-width:64ch}
.block{display:flex;flex-direction:column;gap:12px}
.block>h2{font-size:1.55rem;text-transform:uppercase;letter-spacing:.03em}
.block>h2 .count{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-3);letter-spacing:0;margin-left:6px;font-weight:500}
.block>p{max-width:64ch;color:var(--ink-2)}
h3{font-size:1.25rem;letter-spacing:.01em}

/* ---------- Composants ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:700 .86rem/1 var(--f-body);padding:9px 13px;border-radius:999px;cursor:pointer;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.sm{padding:6px 10px;font-size:.8rem}
.tag{display:inline-flex;align-items:center;gap:4px;font:700 .74rem/1 var(--f-body);padding:5px 8px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;text-decoration:none}
a.tag:hover{background:var(--surface-3);color:var(--ink)}
.tag.mark{background:var(--warn-soft);color:var(--warn)}
.tag.decl{background:var(--restrict-soft);color:var(--restrict)}
.tag.no{background:var(--restrict);color:var(--on-restrict)}
.tag.okk{background:var(--ok-soft);color:var(--ok)}
.tag.bord{background:var(--accent-soft);color:var(--accent)}
.maille{display:inline-flex;align-items:center;gap:5px;font:600 .8rem/1 var(--f-mono);padding:5px 8px;border-radius:5px;border:1px solid var(--line-2);color:var(--ink);white-space:nowrap}
.maille svg{width:16px;height:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 .95rem/1 var(--f-body);padding:12px 16px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--restrict);border-color:var(--restrict);color:var(--on-restrict)}
.btn[disabled]{opacity:.55;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.note .ico{margin-top:1px}
.note.restrict{background:var(--restrict-soft)}
.note.restrict .ico,.note.restrict strong{color:var(--restrict)}
.note.ok{background:var(--ok-soft)}
.note.ok .ico,.note.ok strong{color:var(--ok)}
.note.warn{background:var(--warn-soft)}
.note.warn .ico,.note.warn strong{color:var(--warn)}
.note p+p{margin-top:6px}
.ext{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;color:var(--accent)}
.ext .ico{width:16px;height:16px}
.ext:hover{text-decoration:underline}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dl.facts dt{font:600 .72rem/1.6 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
dl.facts dd{margin:0;min-width:0}
@media (max-width:420px){dl.facts{grid-template-columns:1fr;gap:0}dl.facts dd{margin-bottom:8px}}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
ol.steps li::before{content:counter(s);font:600 .8rem/26px var(--f-mono);text-align:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper)}
ul.dots{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}

/* ---------- Accueil ---------- */
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(2.6rem,11vw,4.4rem);text-transform:uppercase;letter-spacing:.015em;line-height:.92}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lede{font-size:1.06rem;color:var(--ink-2);max-width:56ch}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.today>div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.today .k{font:600 .68rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.today .v{font:600 1.05rem/1.25 var(--f-mono);font-variant-numeric:tabular-nums}
.today .s{font-size:.82rem;color:var(--ink-2)}
.moon{width:26px;height:26px;vertical-align:-7px;margin-right:6px}
.moon .m-dark{fill:var(--surface-3)}
.moon .m-lit{fill:var(--ink)}
.now-grid{display:grid;gap:8px}
.now-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.now-row .lab{font:600 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);width:100%}
.idee{font-size:1.02rem;max-width:64ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;min-height:96px}
.tile .ico{color:var(--accent);width:24px;height:24px}
.tile b{font-family:var(--f-display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.03em}
.tile span{font-size:.82rem;color:var(--ink-2);line-height:1.35}
.tile:hover{border-color:var(--ink-3)}
.golden{counter-reset:g;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.golden li{display:flex;gap:10px;align-items:baseline}
.golden li::before{counter-increment:g;content:counter(g,decimal-leading-zero);font:600 .78rem var(--f-mono);color:var(--accent)}

/* ---------- Espèces ---------- */
.toolbar{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:0 12px}
.search input{border:0;background:transparent;font:inherit;font-size:16px;padding:11px 0;width:100%;color:var(--ink);min-width:0}
.search input:focus{outline:none}
.search:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.segs{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface);align-self:flex-start}
.segs button{border:0;background:transparent;padding:10px 14px;font-weight:700;font-size:.9rem;cursor:pointer;color:var(--ink-2)}
.segs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sp-list{display:grid;gap:10px}
.sp{background:var(--surface);border:1px solid var(--line);border-radius:12px;scroll-margin-top:84px}
.sp>summary{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sp-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sp-name{font-family:var(--f-display);font-weight:700;font-size:1.45rem;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.sp-sub{font-size:.84rem;color:var(--ink-2);margin-top:4px}
.sp-sub i{font-family:var(--f-body)}
.sp-badges{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.sp-now{font:600 .74rem var(--f-mono);letter-spacing:.04em}
.sp-now.l3{color:var(--lvl-3)} .sp-now.l2{color:var(--ink)} .sp-now.l1,.sp-now.l0{color:var(--ink-3)}
.chev{width:18px;height:18px;transition:transform .2s;color:var(--ink-3)}
.sp[open] .chev{transform:rotate(180deg)}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.strip i{height:9px;border-radius:2px;background:var(--lvl-0)}
.strip i.l1{background:var(--lvl-1)} .strip i.l2{background:var(--lvl-2)} .strip i.l3{background:var(--lvl-3)}
.strip i.now{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent)}
.strip-m{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font:500 .6rem var(--f-mono);color:var(--ink-3);text-align:center;margin-top:3px}
.sp-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.sp-body h4{margin:0 0 3px;font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cal-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.cal{border-collapse:separate;border-spacing:3px;min-width:640px;width:100%}
.cal th{font:600 .7rem var(--f-mono);color:var(--ink-3);padding:6px 0;text-align:center}
.cal th.sp-h{text-align:left;font:700 .86rem var(--f-body);color:var(--ink);padding:4px 8px;white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}
.cal td{height:26px;border-radius:4px;background:var(--lvl-0);text-align:center;font:600 .62rem var(--f-mono);color:var(--ink-3)}
.cal td.l1{background:var(--lvl-1);color:var(--ink-2)} .cal td.l2{background:var(--lvl-2);color:var(--ink)} .cal td.l3{background:var(--lvl-3);color:var(--lvl-ink)}
.cal .now{box-shadow:inset 0 0 0 2px var(--accent)}
.cal th.now{color:var(--accent);box-shadow:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:16px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.ban-list{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.ban{padding:14px;border-radius:12px;background:var(--restrict-soft);display:flex;flex-direction:column;gap:5px}
.ban b{font-family:var(--f-display);font-size:1.2rem;text-transform:uppercase;letter-spacing:.02em;color:var(--restrict)}

/* ---------- Techniques ---------- */
.tech{padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:84px}
.tech-head{display:flex;flex-direction:column;gap:6px}
.tech-head h3{font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em}
.tech details{border-top:1px solid var(--line);padding-top:10px}
.tech details>summary{display:flex;align-items:center;justify-content:space-between;font-weight:700;padding:2px 0}

/* ---------- Schémas de montage ---------- */
.rig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.rig{padding:14px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:84px}
.rig svg{width:100%;max-width:400px;height:auto;display:block}
.rg-line{stroke:var(--ink-2);stroke-width:2;fill:none}
.rg-leader{stroke:var(--accent);stroke-width:2.2;fill:none}
.rg-metal{fill:none;stroke:var(--ink);stroke-width:1.8}
.rg-gear{fill:var(--surface-2);stroke:var(--ink);stroke-width:1.6}
.rg-knot{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.rg-bead{fill:var(--accent)}
.rg-stop{stroke:var(--accent);stroke-width:2.4;fill:none}
.rg-sink{fill:var(--ink-3);stroke:var(--ink);stroke-width:1.2}
.rg-hook{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rg-lure{fill:var(--lvl-2);stroke:var(--ink);stroke-width:1.4}
.rg-soft{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.rg-head{fill:var(--ink-3);stroke:var(--ink);stroke-width:1.2}
.rg-eye{fill:var(--ink)}
.rg-float-top{fill:var(--accent);stroke:var(--ink);stroke-width:1.2}
.rg-float-bot{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.rg-water{stroke:var(--lvl-2);stroke-width:2;fill:none}
.rg-lbl{font-family:var(--f-body);font-size:12.5px;fill:var(--ink)}
.rg-lead{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 3;fill:none}
.rg-sea{fill:var(--map-sea)}
.rg-bed{fill:var(--map-land);stroke:var(--map-land-line);stroke-width:1}
.rg-buoy{fill:var(--accent);stroke:var(--ink);stroke-width:1.4}
.rg-small{font-family:var(--f-mono);font-size:11px;fill:var(--ink-2)}

/* ---------- Nœuds ---------- */
.which{width:100%;border-collapse:collapse;font-size:.92rem}
.which td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.which tr:first-child td{border-top:0}
.which td:first-child{color:var(--ink-2)}
.which a{font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap}
.knot{padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:84px}
.knot-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.knot-head h3{font-size:1.45rem;text-transform:uppercase;letter-spacing:.02em}
.lvl{display:inline-flex;gap:3px;align-items:center;font:600 .72rem var(--f-mono);color:var(--ink-3)}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}

.anat{width:100%;max-width:560px;height:auto;display:block}
.an-ring{fill:none;stroke:var(--ink-3);stroke-width:5}
.an-main{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.an-tag{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.an-back{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;opacity:.35}
.an-txt{font-family:var(--f-body);font-size:12.5px;fill:var(--ink-2)}

/* ---------- Carte des zones ---------- */
.map-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.map-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--map-sea);-webkit-overflow-scrolling:touch}
.map-wrap svg{display:block;width:100%;height:auto}
.map-wrap.zoom svg{width:230%;max-width:none}
.m-land{fill:var(--map-land);stroke:var(--map-land-line);stroke-width:1.4}
.m-band{fill:none;stroke:var(--map-band);stroke-width:34;stroke-linejoin:round;stroke-linecap:round}
.m-grid{stroke:var(--map-grid);stroke-width:1;stroke-dasharray:3 7;fill:none}
.m-frame{fill:none;stroke:var(--ink-3);stroke-width:2}
.m-tick{font-family:var(--f-mono);font-size:15px;fill:var(--ink-3)}
.m-town{font-family:var(--f-display);font-weight:700;font-size:25px;letter-spacing:.06em;text-transform:uppercase;fill:var(--ink)}
.m-isle{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;fill:var(--ink)}
.m-water{font-family:var(--f-body);font-style:italic;font-size:26px;fill:var(--ink-2)}
.m-water.s{font-size:17px}
.m-ban{fill:url(#hatch);stroke:var(--restrict);stroke-width:2.2}
.m-hatch{stroke:var(--restrict);stroke-width:3;opacity:.6}
.m-zmp{fill:none;stroke:var(--restrict);stroke-width:2.4;stroke-dasharray:6 5}
.m-bantxt{font-family:var(--f-body);font-weight:700;font-size:17px;fill:var(--restrict)}
.m-beacon{fill:var(--ink)}
.m-beacon2{fill:var(--accent)}
.mk{cursor:pointer}
.mk circle{stroke:var(--paper);stroke-width:3}
.mk text{font-family:var(--f-mono);font-weight:600;font-size:21px;fill:var(--paper);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.bord circle{fill:var(--accent)} .mk.bateau circle{fill:var(--ink)} .mk.deux circle{fill:var(--ok)}
.mk.dim{opacity:.22}
.mk.sel circle{stroke:var(--accent);stroke-width:5}
.mk:focus-visible circle{stroke:var(--accent);stroke-width:6}
.m-scale{stroke:var(--ink);stroke-width:3}
.m-scaletxt{font-family:var(--f-mono);font-size:15px;fill:var(--ink)}
.m-north{fill:var(--ink)}
.dotk{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}
.zone-list{display:grid;gap:10px}
.zone{padding:16px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:84px}
.zone-head{display:flex;gap:12px;align-items:flex-start}
.znum{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 .95rem var(--f-mono)}
.znum.bord{background:var(--accent);color:var(--on-accent)} .znum.bateau{background:var(--ink);color:var(--paper)} .znum.deux{background:var(--ok);color:var(--on-ok)}
.zone-head h3{font-size:1.35rem;text-transform:uppercase;letter-spacing:.02em}
.zone-head p{font-size:.86rem;color:var(--ink-2)}
.zone.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

/* ---------- Règles ---------- */
.rules{display:grid;gap:10px}
.rule{padding:16px;display:flex;flex-direction:column;gap:8px}
.rule h3{font-size:1.3rem;text-transform:uppercase;letter-spacing:.02em}
.ruler-box{padding:14px;display:flex;flex-direction:column;gap:10px}
.ruler-box svg{width:100%;height:auto;display:block}
.ru-body{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.2}
.ru-tick{stroke:var(--ink);stroke-width:1}
.ru-num{font:600 17px var(--f-mono);fill:var(--ink)}
.ru-out{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.ru-out strong{font-family:var(--f-display);font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em}
.ru-out span{font:600 .85rem var(--f-mono);color:var(--accent)}
.ru-fish{fill:var(--lvl-2);stroke:var(--ink);stroke-width:1.2}
.ru-fishg{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ru-end{stroke:var(--accent);stroke-width:2.5}
.ru-lbl{font:700 15px var(--f-body);fill:var(--ink)}
.ru-lbl2{font:600 13px var(--f-mono);fill:var(--accent)}
.ru-notch{fill:var(--ink-3)}
.size-table{width:100%;border-collapse:collapse;font-size:.92rem}
.size-table td{padding:7px 8px;border-top:1px solid var(--line)}
.size-table td:last-child{text-align:right;font:600 .9rem var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.size-table tr.sel td{background:var(--surface-2)}
.size-table button{all:unset;cursor:pointer;font-weight:700}
.size-table button:focus-visible{outline:3px solid var(--accent)}
.cols2{columns:2 260px;column-gap:24px}
.src{display:flex;flex-direction:column;gap:6px;font-size:.88rem}

/* ---------- Carnet ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .k{font:600 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .v.t{font-size:1.25rem}
.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lab{font-weight:700;font-size:.85rem}
.field input,.field select,.field textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.radio-seg{display:flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.radio-seg label{flex:1;text-align:center;padding:10px 6px;font-weight:700;font-size:.9rem;cursor:pointer;color:var(--ink-2)}
.radio-seg input{position:absolute;opacity:0;pointer-events:none}
.radio-seg input:checked+span{color:var(--paper)}
.radio-seg label:has(input:checked){background:var(--ink);color:var(--paper)}
.radio-seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:-3px}
.alerts{display:flex;flex-direction:column;gap:6px}
.entries{display:flex;flex-direction:column;gap:14px}
.day{display:flex;flex-direction:column;gap:6px}
.day-h{font:600 .74rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.entry{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.entry-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.entry-t{font-family:var(--f-display);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.02em}
.entry-m{font:500 .82rem var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.entry-actions{display:flex;gap:6px;flex-wrap:wrap}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 4px;font-size:.88rem}
.empty{padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.preview{opacity:.75;border-style:dashed;width:100%}
.status{font-size:.9rem}

/* ---------- Quiz ---------- */
.quiz{padding:18px;display:flex;flex-direction:column;gap:14px}
.q-top{display:flex;justify-content:space-between;font:600 .78rem var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.q-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.q-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q-q{font-family:var(--f-body);font-size:1.2rem;font-weight:700;line-height:1.35;text-transform:none}
.q-opts{display:grid;gap:8px}
.q-opt{text-align:left;padding:13px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;cursor:pointer;min-height:48px}
.q-opt:hover:not([disabled]){border-color:var(--ink)}
.q-opt.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.q-opt.bad{background:var(--restrict-soft);border-color:var(--restrict)}
.q-opt[disabled]{cursor:default}
.q-exp{display:flex;flex-direction:column;gap:10px}
.q-end{text-align:left;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.q-score{font-family:var(--f-display);font-weight:700;font-size:4rem;line-height:.9}

/* ---------- Checklist ---------- */
.ck-prog{display:flex;align-items:center;gap:12px}
.ck-prog .bar{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.ck-prog .bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.ck-group{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.ck-group h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.ck-item{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer;border-top:1px solid var(--line)}
.ck-item:first-of-type{border-top:0}
.ck-item input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--ok);flex:none}
.ck-item.done span{color:var(--ink-3);text-decoration:line-through}

/* ---------- Glossaire / matériel / sécurité ---------- */
dl.glos{margin:0;display:grid;gap:0}
dl.glos div{padding:11px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px}
dl.glos dt{font-weight:700}
dl.glos dd{margin:0;color:var(--ink-2)}
@media (max-width:520px){dl.glos div{grid-template-columns:1fr;gap:2px}}
.kit{padding:16px;display:flex;flex-direction:column;gap:10px}
.kit-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.kit-head h3{font-size:1.35rem;text-transform:uppercase;letter-spacing:.02em}
.kit table{width:100%;border-collapse:collapse;font-size:.92rem}
.kit td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.kit td:last-child{text-align:right;font:600 .86rem var(--f-mono);white-space:nowrap;padding-left:12px;font-variant-numeric:tabular-nums}
.kit .tot td{font-weight:700;border-top:2px solid var(--ink)}
.budget{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.budget .card{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.budget .v{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1}
.sos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.sos .card{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.sos .n{font-family:var(--f-display);font-weight:700;font-size:2.3rem;line-height:1;color:var(--restrict)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:10px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:960px){.toast{bottom:24px}}
.gl-tools{display:flex;flex-direction:column;gap:10px}
dl.glos dt .gl-c{display:block;font:600 .64rem/1.5 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
dl.glos div{scroll-margin-top:84px}

/* ---------- Mots expliqués (lexique au toucher) ---------- */
.term{cursor:help;text-decoration:underline dotted;-webkit-text-decoration:underline dotted;text-decoration-color:var(--accent);-webkit-text-decoration-color:var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px;border-radius:3px}
.term:hover{background:var(--accent-soft)}
.term:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.term.on{background:var(--accent-soft)}
.defn{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);z-index:55;display:flex;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.defn-in{pointer-events:auto;width:100%;max-width:560px;background:var(--ink);color:var(--paper);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 14px 16px;display:flex;flex-direction:column;gap:6px}
.defn-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.defn-k{display:block;font:600 .64rem/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.defn-t{display:block;font-family:var(--f-display);font-weight:700;font-size:1.35rem;line-height:1.05;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.defn p{line-height:1.45;padding-right:4px}
.defn a{color:inherit;font-weight:700;font-size:.88rem;align-self:flex-start}
.defn-x{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.85}
.defn-x .ico{width:18px;height:18px}
@media (min-width:960px){.defn{bottom:24px}}

/* ---------- Vidéos ---------- */
.vid{display:grid;grid-template-columns:136px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-decoration:none;color:var(--ink)}
.vid:hover{border-color:var(--ink-3)}
.vid-th{position:relative;display:block;width:136px;height:76px;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#17405A,#0B2433)}
.vid-th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vid-play{position:absolute;inset:0;display:grid;place-items:center}
.vid-play svg{width:40px;height:40px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.vid-tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.vid-k{font:600 .66rem/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.vid-tx b{font-weight:700;line-height:1.3;font-size:.95rem}
.vid-s{font-size:.8rem;color:var(--ink-2);line-height:1.35}
.vp-c{fill:var(--accent)} .vp-t{fill:#FFFFFF}
.media{display:flex;flex-direction:column;gap:8px}
.media-links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem}
@media (max-width:380px){.vid{grid-template-columns:112px minmax(0,1fr)}.vid-th{width:112px;height:63px}}

/* ---------- Photos des espèces ---------- */
.sp-top{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start}
.sp-id{display:flex;flex-direction:column;gap:7px;min-width:0}
.sp-badges{justify-content:flex-start}
.sp-thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-3)}
.sp-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sp-photo{margin:0;display:flex;flex-direction:column;gap:6px}
.sp-photo .ph{position:relative;display:block;border-radius:10px;overflow:hidden;background:var(--surface-2);aspect-ratio:3/2;max-height:340px}
.sp-photo .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

.sp-photo figcaption{font-size:.76rem;color:var(--ink-3);line-height:1.4}
.sp-photo figcaption a{color:inherit}
.knot-name{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.knot-name .ico{width:18px;height:18px;color:var(--accent);margin-top:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* Lexique. t = mot, c = famille, k = formes repérées dans les textes (soulignées, touche pour la définition),
   re = motif pour les chiffres (30/100, 2 à 4 nœuds…), once = souligné une seule fois par fiche, d = définition. */
const GLOSS=[
 /* Nœuds */
 {t:"Palomar",c:"Nœuds",k:["palomar"],d:"C'est juste le nom d'un nœud, pas un objet à acheter. On le fait avec le fil plié en deux : le plus solide pour attacher un hameçon, un émerillon ou un leurre sur de la tresse."},
 {t:"Clinch amélioré",c:"Nœuds",k:["clinch amélioré","clinch"],d:"Le nom d'un nœud : « clinch » est un mot anglais qui veut dire bloquer, serrer. On enroule le fil autour de lui-même, puis on le repasse dans les boucles. Parfait sur le nylon, il glisse sur la tresse."},
 {t:"Uni (Grinner)",c:"Nœuds",k:["uni","grinner"],d:"Le nom d'un nœud : « Uni » pour universel, parce qu'il sert presque partout (hameçon, émerillon, agrafe). Grinner est son autre nom : c'est le même nœud."},
 {t:"Double Uni",c:"Nœuds",k:["double uni","double universel"],d:"Deux nœuds Uni, un sur chaque fil, qui glissent l'un vers l'autre quand tu serres. Il sert à raccorder deux fils, par exemple la tresse et le bas de ligne."},
 {t:"FG",c:"Nœuds",k:["fg"],d:"C'est juste le nom, en deux lettres, d'un nœud de raccord. La tresse s'enroule en croisillons autour du fluorocarbone, comme une natte : très fin, il passe bien dans les anneaux de la canne."},
 {t:"Albright",c:"Nœuds",k:["albright"],d:"Le nom d'un nœud de raccord, qui vient d'un guide de pêche américain. Il relie deux fils de grosseurs très différentes."},
 {t:"Rapala",c:"Nœuds",k:["boucle rapala","rapala"],d:"Rapala est une marque finlandaise de leurres qui a donné son nom à ce nœud. Il laisse une petite boucle libre devant le leurre : le poisson nageur bouge mieux."},
 {t:"Snell (nœud d'empile)",c:"Nœuds",k:["nœud d'empile","snell"],d:"« Snell » est le mot anglais ; en français on dit nœud d'empile. Le fil s'enroule le long de la tige de l'hameçon et sort bien dans l'axe : l'hameçon pique mieux au ferrage."},
 {t:"Bimini twist",c:"Nœuds",k:["bimini twist","bimini"],d:"Un nœud qui vient des îles Bimini, aux Bahamas, haut lieu de la pêche au gros. Il double le bout de la ligne sur une bonne longueur sans l'affaiblir."},
 {t:"Potence (dropper loop)",c:"Nœuds",k:["dropper loop","potences","potence"],d:"Une boucle qui sort sur le côté, au milieu de la ligne, pour y accrocher un hameçon. On dit potence parce qu'elle part en équerre, comme un support en L. « Dropper loop » est son nom anglais."},
 {t:"Boucle du chirurgien",c:"Nœuds",k:["boucle du chirurgien","chirurgien"],d:"Une boucle simple et très solide au bout du fil. Son nom vient du double tour que font les chirurgiens pour les points de suture."},
 {t:"Nœud d'arrêt",c:"Nœuds",k:["nœuds d'arrêt","nœud d'arrêt"],d:"Un petit nœud « stop » fait avec un bout de fil sur ta ligne. Le flotteur coulissant glisse jusqu'à lui et s'arrête : c'est lui qui règle la profondeur."},
 {t:"Demi-clé",c:"Nœuds",k:["demi-clés","demi-clé"],d:"Le nœud le plus simple : le fil fait un tour autour d'un autre et repasse dans sa boucle. On en enchaîne plusieurs pour bloquer la fin d'un nœud."},
 {t:"Nœud simple",c:"Nœuds",k:["nœud simple"],d:"Le nœud de base, celui qu'on fait sans y penser : une boucle, on passe le bout dedans, on serre."},
 {t:"Ganse",c:"Nœuds",k:["ganse"],d:"Un U formé en repliant le bout du fil sur lui-même."},
 {t:"Œillet",c:"Nœuds",k:["œillets","œillet"],d:"Le petit anneau au bout de l'hameçon, du leurre ou de l'émerillon, dans lequel on passe le fil."},
 {t:"Brin principal, brin libre",c:"Nœuds",k:["brin principal","brin libre"],d:"Le brin principal, c'est le côté du fil qui part vers la canne. Le brin libre, c'est le bout avec lequel tu fais le nœud."},
 {t:"Spire",c:"Nœuds",k:["spires"],d:"Un tour de fil enroulé autour d'un autre."},
 /* Fils et montages */
 {t:"Tresse",c:"Fils & montages",k:["tresses","tresse"],once:1,d:"Un fil fait de fibres tressées : très fin, très solide et sans élasticité. Tu sens la moindre touche, mais il se voit dans l'eau et craint le frottement sur les roches."},
 {t:"Nylon (monofilament)",c:"Fils & montages",k:["nylon","monofilament"],once:1,d:"Le fil classique, d'un seul brin, un peu élastique et pas cher. Son élasticité amortit les coups de tête du poisson (traîne, surfcasting)."},
 {t:"Fluorocarbone",c:"Fils & montages",k:["fluorocarbone","fluoro"],once:1,d:"Un fil presque invisible dans l'eau et très résistant au frottement. On l'utilise pour le bas de ligne, devant la tresse."},
 {t:"/100 (diamètre du fil)",c:"Fils & montages",re:"\\d+(?:[–-]\\d+)?\\/100",d:"Le diamètre d'un fil en centièmes de millimètre : 30/100 = 0,30 mm. Plus le chiffre est grand, plus le fil est gros et solide."},
 {t:"Lbs (livres)",c:"Fils & montages",re:"\\d+(?:[\\/–-]\\d+)?\\s?lbs",k:["lbs"],d:"L'unité de force des fils et des cannes de traîne : 1 lb vaut environ 0,45 kg. Une canne 20/30 lbs est faite pour des fils qui cassent entre 9 et 14 kg environ."},
 {t:"Bas de ligne",c:"Fils & montages",k:["bas de ligne"],once:1,d:"Le dernier morceau de fil, entre la ligne et le leurre ou l'hameçon. Plus discret (fluorocarbone) ou plus solide que le reste, il se change facilement."},
 {t:"Corps de ligne",c:"Fils & montages",k:["corps de ligne"],d:"Le fil principal, celui qui est enroulé sur le moulinet."},
 {t:"Arrache-plomb",c:"Fils & montages",k:["arrache-plomb","tête de ligne"],d:"Une dizaine de mètres de fil plus gros au début de la ligne, en surfcasting. Il encaisse le choc du lancer avec un plomb lourd : sans lui, le fil casse."},
 {t:"Avançon (empile)",c:"Fils & montages",k:["avançons","avançon","empiles","empile"],d:"Le petit fil qui porte l'hameçon et qui s'attache sur la ligne principale. On dit aussi empile."},
 {t:"Ligne mère",c:"Fils & montages",k:["ligne mère"],d:"Le fil principal d'une palangre : on y attache les avançons à intervalles réguliers."},
 {t:"Émerillon",c:"Fils & montages",k:["émerillons","émerillon"],d:"Une petite pièce de métal à deux anneaux qui tournent séparément : elle empêche le fil de vriller, c'est-à-dire de s'entortiller."},
 {t:"Agrafe",c:"Fils & montages",k:["agrafes","agrafe"],d:"Une petite attache en métal qui s'ouvre et se ferme comme une épingle : tu changes de leurre sans refaire de nœud."},
 {t:"Anneau brisé",c:"Fils & montages",k:["anneaux brisés","anneau brisé"],d:"Un petit anneau en spirale, comme un porte-clés miniature, qui sert à fixer un hameçon sur un leurre."},
 {t:"Perle",c:"Fils & montages",k:["perles","perle"],d:"Une petite boule en plastique enfilée sur la ligne : elle protège le nœud des chocs du plomb, ou bloque le flotteur contre le nœud d'arrêt."},
 {t:"Plomb",c:"Fils & montages",k:["plombs","plomb"],once:1,d:"Le poids qui fait couler ta ligne. Il en existe de toutes les formes et de tous les poids, comptés en grammes."},
 {t:"Plomb grappin",c:"Fils & montages",k:["plomb grappin"],d:"Un plomb muni de pattes en métal qui s'accrochent au sable : il ne roule pas avec les vagues."},
 {t:"Plomb coulissant",c:"Fils & montages",k:["plomb coulissant"],d:"Un plomb percé qui glisse librement sur la ligne : le poisson tire sur l'appât sans sentir le poids."},
 {t:"Olive",c:"Fils & montages",k:["olives","olive"],d:"Un petit plomb en forme d'olive, percé au milieu, qu'on enfile sur la ligne."},
 {t:"Flotteur coulissant",c:"Fils & montages",k:["flotteurs coulissants","flotteur coulissant"],d:"Un flotteur (un bouchon) qui glisse sur la ligne jusqu'au nœud d'arrêt. Tu peux pêcher profond tout en lançant facilement."},
 {t:"Antenne",c:"Fils & montages",k:["antenne"],d:"La partie fine et colorée du flotteur qui dépasse de l'eau : c'est elle que tu surveilles."},
 {t:"Hameçon",c:"Fils & montages",k:["hameçons","hameçon"],once:1,d:"Le crochet au bout de la ligne. Plus son numéro est grand, plus il est petit (n°8 petit, n°1 moyen) ; ensuite on passe à 1/0, 2/0, 3/0… qui grossissent."},
 {t:"Taille d'hameçon",c:"Fils & montages",re:"n°\\s?\\d+|\\d\\/0",d:"Plus le numéro est grand, plus l'hameçon est petit : n°8 petit, n°1 moyen. Après le n°1, on compte 1/0, 2/0, 3/0… et là, plus le chiffre est grand, plus l'hameçon est gros."},
 {t:"Ardillon",c:"Fils & montages",k:["ardillon"],d:"La petite pointe retournée juste derrière la pointe de l'hameçon : elle empêche le poisson (et l'hameçon planté dans ton doigt) de ressortir."},
 {t:"Assist",c:"Fils & montages",k:["assists","assist"],d:"Un hameçon monté sur un petit bout de fil souple, accroché en haut d'un jig. Il pend le long du leurre et s'accroche moins au fond."},
 {t:"Montage",c:"Fils & montages",k:[],d:"Tout ce que tu installes au bout de ta ligne : nœuds, plomb, émerillon, bas de ligne, hameçon ou leurre."},
 /* Leurres et appâts */
 {t:"Leurre",c:"Leurres & appâts",k:["leurres","leurre"],once:1,d:"Une fausse proie, en plastique, en bois ou en métal, qui imite un petit poisson, une crevette ou un calamar. On l'anime pour déclencher l'attaque."},
 {t:"Poisson nageur",c:"Leurres & appâts",k:["poissons nageurs","poisson nageur"],once:1,d:"Un leurre dur en forme de poisson, qui nage tout seul quand on le tire. Sa bavette le fait plonger."},
 {t:"Bavette",c:"Leurres & appâts",k:["bavette"],d:"La palette transparente à l'avant d'un poisson nageur : plus elle est grande, plus le leurre plonge profond."},
 {t:"Leurre souple",c:"Leurres & appâts",k:["leurres souples","leurre souple"],once:1,d:"Une imitation en caoutchouc d'un poisson ou d'un ver, montée sur une tête plombée. Le leurre le plus polyvalent pour débuter."},
 {t:"Tête plombée",c:"Leurres & appâts",k:["têtes plombées","tête plombée"],d:"Un hameçon avec une boule de plomb à l'avant. On y enfile un leurre souple : le plomb le fait couler, l'hameçon pique."},
 {t:"Stickbait, popper",c:"Leurres & appâts",k:["stickbaits","stickbait","poppers","popper"],d:"Des leurres de surface. Le stickbait zigzague comme un poisson en fuite ; le popper fait des « ploc » et des éclaboussures."},
 {t:"Jig",c:"Leurres & appâts",k:["jigs","jig"],once:1,d:"Un leurre en métal, lourd et allongé. On le fait monter et descendre près du fond : il imite un petit poisson blessé."},
 {t:"Casting jig",c:"Leurres & appâts",k:["casting jigs","casting jig"],d:"Un petit jig de 20 à 40 g, fait pour être lancé loin et ramené vite, par exemple sur une chasse de bonites."},
 {t:"Jigging, slow jig",c:"Techniques",k:["slow jigging","slow jig","jigging"],d:"Le jigging, c'est pêcher au jig à la verticale sous le bateau. Le slow jig est la version lente : un jig plat qui retombe en planant."},
 {t:"Fireball",c:"Leurres & appâts",k:["fireball"],d:"Une grosse tête plombée avec un ou deux hameçons, sur laquelle on fixe un vif (souvent un calamar) pour le présenter près du fond."},
 {t:"Tenya",c:"Leurres & appâts",k:["tenya"],d:"Un mot japonais : une tête plombée avec hameçon, qu'on garnit d'une crevette. On la pose au fond, puis on la soulève doucement."},
 {t:"Turlutte",c:"Leurres & appâts",k:["turluttes","turlutte"],once:1,d:"Un leurre en forme de crevette avec une couronne de petites pointes sans ardillon. Le calamar ou la seiche l'attrape avec ses tentacules et reste piqué."},
 {t:"Eging",c:"Techniques",k:["eging"],d:"La pêche des calamars et des seiches à la turlutte. Le mot vient du japonais « egi », qui veut dire turlutte."},
 {t:"Tataki",c:"Techniques",k:["tataki"],d:"Un mot japonais qui évoque de petits coups : on fait vibrer la turlutte par petites secousses de canne, ici depuis le bateau, avec une turlutte lestée sous la coque."},
 {t:"Plume (jupette)",c:"Leurres & appâts",k:["plumes","plume","jupettes","jupette"],d:"Un leurre de traîne fait d'une tête et d'une jupe de plumes ou de plastique, qui frétille derrière le bateau."},
 {t:"Cuiller",c:"Leurres & appâts",k:["cuillers","cuiller","cuillères","cuillère"],d:"Un leurre en métal brillant qui ondule ou tourne quand on le ramène, comme un petit poisson qui scintille."},
 {t:"Mitraillette",c:"Leurres & appâts",k:["mitraillettes","mitraillette"],d:"Un bas de ligne avec plusieurs petites plumes en série : on prend les maquereaux et les sévereaux par grappes. Chaque plume compte comme un hameçon."},
 {t:"Appât (esche)",c:"Leurres & appâts",k:["appâts","appât","esches","escher","esche"],once:1,d:"La vraie nourriture qu'on met sur l'hameçon : ver, sardine, crevette, calamar… « Escher », c'est mettre l'appât sur l'hameçon."},
 {t:"Vif",c:"Leurres & appâts",k:["vifs","vif"],once:1,d:"Un petit poisson ou un calamar vivant, utilisé comme appât pour les gros prédateurs."},
 {t:"Broumé",c:"Leurres & appâts",k:["broumé"],d:"Un mélange de sardines hachées et de pain mouillé qu'on jette par petites boules pour attirer les poissons. Ailleurs, on parle d'amorce ou de strouille."},
 {t:"Bibi",c:"Leurres & appâts",k:["bibi"],d:"Un ver marin épais qui vit dans le sable. Les dorades l'adorent."},
 {t:"Néréis",c:"Leurres & appâts",k:["néréis"],d:"Le ver marin le plus courant en magasin de pêche, bon pour presque tous les poissons de fond."},
 {t:"Vers américain et coréen",c:"Leurres & appâts",k:["vers américains","ver américain","américain","coréens","coréen"],d:"De gros vers marins vendus vivants en magasin de pêche, nommés d'après leur pays d'origine. Très bons pour la dorade et le marbré."},
 {t:"Couteau",c:"Leurres & appâts",k:["couteau"],d:"Un coquillage long et fin qui vit enfoui dans le sable : un excellent appât pour la dorade."},
 /* Matériel */
 {t:"Moulinet",c:"Matériel",k:["moulinets","moulinet"],once:1,d:"La bobine fixée sous la canne, qui enroule le fil. Son numéro (2500, 4000, 8000…) indique sa taille : plus il est grand, plus le moulinet est gros."},
 {t:"Frein",c:"Matériel",k:["frein"],once:1,d:"Le réglage du moulinet qui laisse sortir du fil quand le poisson tire trop fort, pour que le fil ne casse pas. Règle-le à environ un tiers de la solidité du fil."},
 {t:"Cliquet",c:"Matériel",k:["cliquet"],d:"Un petit bouton du moulinet qui fait « cric-cric » quand le fil sort : il t'avertit d'une touche quand la canne est posée."},
 {t:"Tambour tournant",c:"Matériel",k:["tambour tournant"],d:"Un moulinet dont la bobine tourne pour enrouler le fil, comme un treuil. Très puissant : c'est le moulinet de la traîne."},
 {t:"Spinning",c:"Matériel",k:["spinning"],d:"Un ensemble canne et moulinet légers, fait pour lancer un leurre et le ramener. Le plus polyvalent."},
 {t:"Pique",c:"Matériel",k:["une pique","la pique"],d:"Le support qu'on plante dans le sable pour tenir la canne debout en surfcasting."},
 {t:"Porte-canne",c:"Matériel",k:["porte-cannes","porte-canne"],d:"Un tube fixé sur le bateau, dans lequel on pose la canne pendant la traîne."},
 {t:"Épuisette",c:"Matériel",k:["épuisette"],d:"Un grand filet monté sur un manche pour sortir le poisson de l'eau sans casser le fil."},
 {t:"Plioir",c:"Matériel",k:["plioir"],d:"Un cadre en bois ou en plastique sur lequel on enroule une ligne à main."},
 {t:"Dégorgeoir",c:"Matériel",k:["dégorgeoir"],d:"Un petit outil pour retirer un hameçon avalé sans abîmer le poisson."},
 /* Techniques */
 {t:"Ferrer",c:"Techniques",k:["ferrage","ferrer","ferre"],once:1,d:"Donner un coup de canne sec au moment de la touche, pour planter l'hameçon dans la bouche du poisson."},
 {t:"Touche",c:"Techniques",k:["à la touche","la touche","une touche","touches"],d:"Le moment où un poisson mord : la canne tape, le fil se tend ou le flotteur s'enfonce."},
 {t:"Pomper",c:"Techniques",k:["pompe doucement","pomper"],d:"Ramener un gros poisson en levant doucement la canne, puis en reprenant du fil pendant que tu la baisses. On recommence jusqu'au bateau."},
 {t:"Animer",c:"Techniques",k:["animer","anime"],d:"Donner vie au leurre avec des petits mouvements de canne, des pauses et des accélérations."},
 {t:"Palangrotte",c:"Techniques",k:["palangrotte"],d:"La ligne à main traditionnelle de Provence, enroulée sur un plioir : un fil, un plomb, quelques hameçons. Simple et redoutable."},
 {t:"Palangre",c:"Techniques",k:["palangres","palangre"],d:"Une longue ligne posée au fond, avec beaucoup d'hameçons, qu'on laisse en place puis qu'on relève. Très encadrée en pêche de loisir."},
 {t:"Surfcasting",c:"Techniques",k:["surfcasting"],d:"La pêche depuis la plage : on lance très loin un plomb lourd et des appâts avec une longue canne, puis on la pose sur une pique."},
 {t:"Traîne",c:"Techniques",k:["traîne"],once:1,d:"Pêcher en tirant un leurre derrière le bateau qui avance doucement."},
 {t:"Mouillage",c:"Techniques",k:["mouillage"],once:1,d:"Pêcher avec le bateau ancré. Le mot désigne aussi l'endroit où l'on jette l'ancre ; « mouiller », c'est jeter l'ancre ou poser un engin au fond."},
 {t:"Dérive",c:"Techniques",k:["dérive"],once:1,d:"Laisser le bateau avancer tout seul, moteur coupé, poussé par le vent et le courant : ton appât balaie le fond."},
 {t:"Coup du matin, coup du soir",c:"Techniques",k:["coups du matin et du soir","coup du soir","coup du matin"],d:"Les moments autour du lever et du coucher du soleil, quand la lumière baisse : c'est là que les poissons mangent le plus."},
 {t:"Saigner un poisson",c:"Techniques",k:["saigner","saigne"],d:"Couper une ouïe juste après la capture pour vider le sang : la chair reste bien meilleure, surtout pour les bonites et les thons."},
 /* Poissons */
 {t:"Sévereau (chinchard)",c:"Poissons",k:["sévereaux","sévereau","chinchards","chinchard"],d:"Le chinchard : un petit poisson de banc très commun, avec une rangée de grandes écailles le long du flanc. Pris à la mitraillette, c'est un excellent vif."},
 {t:"Bogue",c:"Poissons",k:["bogues","bogue"],d:"Un petit poisson de banc aux gros yeux et aux lignes dorées. Un bon vif."},
 {t:"Girelle",c:"Poissons",k:["girelles","girelle"],d:"Un petit poisson très coloré des rochers. Le denti l'apprécie comme vif."},
 {t:"Mulet",c:"Poissons",k:["mulets","mulet"],d:"Un poisson argenté très commun dans les ports et les embouchures. Vivant, c'est un super vif pour la liche et le loup."},
 {t:"Saupe",c:"Poissons",k:["saupes","saupe"],d:"Un poisson argenté rayé de jaune qui broute les algues, en bancs le long des rochers."},
 {t:"Oblade",c:"Poissons",k:["oblades","oblade"],d:"Un petit poisson argenté avec une tache noire devant la queue, en bancs près des rochers. Elle adore le pain."},
 {t:"Sparidé",c:"Poissons",k:["sparidés","sparidé"],d:"La famille des dorades : dorade royale, sar, pagre, pageot, denti… Corps ovale et épines sur le dos."},
 {t:"Pélagique",c:"Poissons",k:["pélagiques","pélagique"],d:"Un poisson qui vit en pleine eau, loin du fond, souvent en bancs et en mouvement : bonite, thonine, maquereau, coryphène."},
 {t:"Prédateur",c:"Poissons",k:["prédateurs","prédateur"],once:1,d:"Un poisson qui chasse et mange d'autres poissons : loup, denti, liche, bonite…"},
 {t:"Céphalopode",c:"Poissons",k:["céphalopodes","céphalopode"],d:"La famille du calamar, de la seiche et du poulpe : des tentacules, de l'encre et pas d'arêtes."},
 {t:"Ligne latérale",c:"Poissons",k:["ligne latérale"],d:"Une ligne visible le long du flanc du poisson. C'est un organe qui sent les vibrations dans l'eau."},
 {t:"Ouïes",c:"Poissons",k:["ouïes"],d:"Les fentes de chaque côté de la tête, par où le poisson respire. Attention : leur bord coupe souvent."},
 {t:"Lobe de la queue",c:"Poissons",k:["lobe"],d:"La queue d'un poisson a deux pointes, les lobes. Pour le marquage, on coupe celui du bas."},
 {t:"Banc",c:"Poissons",k:["bancs","banc"],once:1,d:"Un groupe de poissons qui nagent ensemble."},
 {t:"Barotraumatisme",c:"Poissons",k:["barotraumatisme"],d:"La blessure d'un poisson remonté trop vite des grands fonds : son corps gonfle pendant la remontée. Relâché, il survit mal."},
 {t:"Corb",c:"Poissons",k:["corb"],d:"Un poisson brun doré des rochers, protégé : sa pêche est interdite, on le relâche."},

/* =====================================================================
   Soleil et lune (calcul local, Mandelieu-La Napoule)
   ===================================================================== */
const HOME={lat:43.52,lon:6.94};
const RAD=Math.PI/180,DAYMS=86400000,J1970=2440588,J2000=2451545;
function sunTimes(date,lat,lng){
 const lw=RAD*-lng,phi=RAD*lat;
 const d=date.valueOf()/DAYMS-0.5+J1970-J2000;
 const n=Math.round(d-0.0009-lw/(2*Math.PI));
 const ds=0.0009+lw/(2*Math.PI)+n;
 const M=RAD*(357.5291+0.98560028*ds);
 const C=RAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
 const L=M+C+RAD*102.9372+Math.PI;
 const dec=Math.asin(Math.sin(RAD*23.4397)*Math.sin(L));
 const Jnoon=J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
 const fromJ=j=>new Date((j+0.5-J1970)*DAYMS);
 const out={};
 [[-0.833,"rise","set"],[-6,"dawn","dusk"]].forEach(([h,a,b])=>{
  const w=Math.acos((Math.sin(h*RAD)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)));
  const Jset=J2000+(0.0009+(w+lw)/(2*Math.PI)+n)+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
  out[a]=fromJ(Jnoon-(Jset-Jnoon));out[b]=fromJ(Jset);
 });
 return out;
}
function moonInfo(date){
 const syn=29.530588853,ref=Date.UTC(2000,0,6,18,14);
 let age=((date-ref)/DAYMS)%syn;if(age<0)age+=syn;
 const f=age/syn,ill=(1-Math.cos(2*Math.PI*f))/2;
 const names=["Nouvelle lune","Premier croissant","Premier quartier","Gibbeuse croissante","Pleine lune","Gibbeuse décroissante","Dernier quartier","Dernier croissant"];
 const idx=Math.floor((age/syn)*8+0.5)%8;
 return {f,ill,name:names[idx],age};
}
function moonSVG(f){
 const r=10,cx=12,cy=12,wax=f<0.5,k=Math.cos(2*Math.PI*f),rx=Math.abs(k)*r;
 const ls=wax?1:0,ts=k>0?(wax?0:1):(wax?1:0);
 return '<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><circle class="m-dark" cx="12" cy="12" r="10"/><path class="m-lit" d="M'+cx+" "+(cy-r)+" A"+r+" "+r+" 0 0 "+ls+" "+cx+" "+(cy+r)+" A"+rx.toFixed(2)+" "+r+" 0 0 "+ts+" "+cx+" "+(cy-r)+'Z"/></svg>';
}

let creditsAsked=false;
function loadCredits(){
 if(creditsAsked||!window.fetch)return;creditsAsked=true;
 const fresh=Date.now()-30*864e5;
 const need=Object.values(PHOTOS).filter(p=>!p.a&&!(PCRED[p.f]&&PCRED[p.f].t>fresh)).map(p=>p.f);
 if(!need.length)return;
 const url="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=extmetadata&iiextmetadatafilter=Artist%7CLicenseShortName&titles="+encodeURIComponent(need.map(f=>"File:"+f).join("|"));
 fetch(url).then(r=>r.ok?r.json():null).then(j=>{
  if(!j||!j.query)return;
  const back={};(j.query.normalized||[]).forEach(n=>{back[n.to]=n.from});
  Object.values(j.query.pages||{}).forEach(pg=>{
   const ii=pg.imageinfo&&pg.imageinfo[0];if(!ii)return;
   const m=ii.extmetadata||{};
   const f=(back[pg.title]||pg.title).replace(/^File:/,"").replace(/ /g,"_");
   const a=txtOf(m.Artist&&m.Artist.value);
   PCRED[f]={a:a.length>70?a.slice(0,68)+"…":a,l:txtOf(m.LicenseShortName&&m.LicenseShortName.value),t:Date.now()};
  });
  LS.set("photo-credits-v1",PCRED);
  $$("[data-cr]").forEach(el=>{const p=Object.values(PHOTOS).find(x=>x.f===el.dataset.cr);if(p)el.innerHTML=credTxt(p)});
 }).catch(()=>{});
}

const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
let TERM_RE=null,TERM_IDX=[],TERMS_READY=false;
function termRe(){
 if(TERM_RE!==null)return TERM_RE;
 const alts=[];
 GLOSS.forEach((g,i)=>{
  if(g.re)alts.push({s:g.re,i,n:1000});
  (g.k||[]).forEach(k=>alts.push({s:reEsc(k).replace(/ /g,"\\s+").replace(/'/g,"['’]"),i,n:k.length}));
 });
 alts.sort((a,b)=>b.n-a.n);
 TERM_IDX=alts.map(a=>a.i);
 try{TERM_RE=new RegExp("(^|[^\\p{L}\\p{N}])(?:"+alts.map(a=>"("+a.s+")").join("|")+")(?=[^\\p{L}\\p{N}]|$)","giu")}catch(e){TERM_RE=false}
 return TERM_RE;
}
const TERM_SKIP="a,button,input,textarea,select,label,summary,h1,h2,h3,h4,svg,code,.term,.tag,.chip,.mono,.vh,.vid,.media-links,.maille,.knot-name,.sp-photo,.lvl,.cal-wrap,.size-table,.no-terms";
function linkTerms(root){
 const re=termRe();if(!re||!root)return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
  if(!n.nodeValue||n.nodeValue.length<2)return NodeFilter.FILTER_REJECT;
  const p=n.parentElement;return !p||p.closest(TERM_SKIP)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 const seen=new Map();
 const first=(scope,i)=>{let s=seen.get(scope);if(!s){s=new Set();seen.set(scope,s)}if(s.has(i))return false;s.add(i);return true};
 for(const n of nodes){
  const txt=n.nodeValue,p=n.parentElement;
  const near=p.closest("details,article,.card,section")||root;
  const card=p.closest("article,details.sp,.card")||near;
  let m,last=0,frag=null;re.lastIndex=0;
  while((m=re.exec(txt))){
   let g=-1;for(let j=2;j<m.length;j++){if(m[j]!==undefined){g=j-2;break}}
   if(g<0)continue;
   const i=TERM_IDX[g],word=m[g+2];
   if(!first(GLOSS[i].once?card:near,i))continue;
   const start=m.index+m[1].length;
   if(!frag)frag=document.createDocumentFragment();
   if(start>last)frag.appendChild(document.createTextNode(txt.slice(last,start)));
   const s=document.createElement("span");s.className="term";s.setAttribute("role","button");s.tabIndex=0;s.dataset.t=i;s.textContent=word;
   frag.appendChild(s);last=start+word.length;
  }
  if(frag){if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));p.replaceChild(frag,n)}
 }
}

const C={state:"loading",mode:"db",rows:[],db:null,editId:null,err:null};
/* Hors de Claude (par exemple sur GitHub Pages), le carnet est gardé dans le navigateur de l'appareil. */
const LKEY="carnet-peche-v1";
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LKEY)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}
function saveLocal(rows){try{localStorage.setItem(LKEY,JSON.stringify(rows));return true}catch(e){return false}}
const newId=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function initLocal(){
 C.mode="local";C.rows=loadLocal();C.state="ready";renderCarnet();renderHomeCarnet();
 window.addEventListener("storage",e=>{if(e.key===LKEY){C.rows=loadLocal();renderCarnetList();renderHomeCarnet()}});
}
function downloadFile(name,text,type){
 const blob=new Blob([text],{type});const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function backupJSON(){
 downloadFile("carnet-peche-sauvegarde-"+isoDate(new Date())+".json",JSON.stringify({app:"peche-golfe-napoule",version:1,date:new Date().toISOString(),rows:C.rows},null,1),"application/json");
 toast("Sauvegarde téléchargée");
}
function restoreBackup(file){
 if(!file)return;
 const rd=new FileReader();
 rd.onload=()=>{
  try{
   const obj=JSON.parse(rd.result);
   const rows=Array.isArray(obj)?obj:(obj&&Array.isArray(obj.rows)?obj.rows:null);
   if(!rows)throw new Error("format");
   const map=new Map(C.rows.map(r=>[r.id,r]));let n=0;
   rows.forEach(r=>{if(r&&typeof r==="object"&&r.date&&r.espece){const id=String(r.id||newId());if(!map.has(id))n++;map.set(id,Object.assign({},r,{id}))}});
   const all=Array.from(map.values());
   if(!saveLocal(all)){toast("Restauration impossible : le stockage du navigateur est plein ou bloqué");return}
   C.rows=all;renderCarnetList();renderHomeCarnet();
   toast(n?n+" prise"+(n>1?"s":"")+" ajoutée"+(n>1?"s":"")+" depuis la sauvegarde":"Rien de nouveau dans cette sauvegarde");
  }catch(e){toast("Fichier non reconnu : choisis une sauvegarde du carnet (.json)")}
 };
 rd.readAsText(file);
}

function readForm(){

 const num=id=>{const v=g(id).replace(",",".");return v===""?null:Number(v)};
 const esp=g("cf-espece"),date=g("cf-date");
 if(!date||!esp){$("#cf-err").innerHTML=note("restrict","warn","<p>Indique au moins la date et l'espèce.</p>");return null}
 const [y,m,d]=date.split("-").map(Number);const mo=moonInfo(new Date(y,m-1,d,22));
 return {date,heure:g("cf-heure"),espece:esp,especeLibre:esp==="autre"?g("cf-esp-lib"):"",nombre:Math.max(1,Math.round(num("cf-nb")||1)),taille:num("cf-taille"),poids:num("cf-poids"),
  garde:(document.querySelector('input[name="cf-garde"]:checked')||{}).value!=="0",zone:g("cf-zone"),zoneLibre:g("cf-zone")==="autre"?g("cf-zone-lib"):"",gps:g("cf-gps"),technique:g("cf-tech"),appat:g("cf-appat"),

function dbMsg(code){
 if(code==="invalid_argument")return "Enregistrement refusé : ce compte ne peut pas écrire dans ce carnet.";
 if(code==="quota_exceeded")return "Le carnet est plein : supprime d'anciennes prises pour faire de la place.";
 if(code==="resource_exhausted")return "Trop de demandes d'un coup : réessaie dans un instant.";
 if(code==="revoked"||code==="not_granted"||code==="capability_disabled"||code==="capability_removed")return "Le carnet n'est plus accessible dans cette vue : recharge la page.";
 return "Enregistrement impossible pour le moment : vérifie ta connexion et réessaie.";
}
async function saveEntry(){
 const data=readForm();if(!data)return;
 const btn=$("#cf-save");btn.disabled=true;$("#cf-err").innerHTML="";
 if(C.mode==="local"){
  const rows=C.rows.slice(),wasEdit=!!C.editId;
  if(wasEdit){const i=rows.findIndex(r=>r.id===C.editId);if(i>=0)rows[i]=Object.assign({id:C.editId},data);else rows.push(Object.assign({id:C.editId},data))}
  else rows.push(Object.assign({id:newId()},data));
  if(!saveLocal(rows)){btn.disabled=false;$("#cf-err").innerHTML=note("restrict","warn","<p>Impossible d'enregistrer sur cet appareil : le stockage du navigateur est plein ou bloqué (navigation privée ?).</p>");return}
  C.rows=rows;renderCarnetList();renderHomeCarnet();toast(wasEdit?"Prise modifiée":"Prise enregistrée");closeForm();return;
 }
 const run=()=>C.editId?C.db.doc("carnet/"+C.editId).set(data):C.db.collection("carnet").add(data);
 try{await run()}
 catch(e){
  if(e&&e.code==="unavailable"){await sleep(500+Math.random()*700);try{await run()}catch(e2){btn.disabled=false;$("#cf-err").innerHTML=note("restrict","warn","<p>"+esc(dbMsg(e2&&e2.code))+"</p>");return}}
  else{btn.disabled=false;$("#cf-err").innerHTML=note("restrict","warn","<p>"+esc(dbMsg(e&&e.code))+"</p>");return}
 }
 toast(C.editId?"Prise modifiée":"Prise enregistrée");closeForm();
}

 const where=[zoneName(r),techName(r),r.appat].filter(Boolean).join(" · ");

async function exportCSV(){
 if(!C.rows.length){toast("Rien à exporter pour l'instant");return}
 const cols=[["date","Date"],["heure","Heure"],["esp","Espèce"],["nombre","Nombre"],["taille","Taille (cm)"],["poids","Poids (kg)"],["garde","Gardé"],["zone","Spot"],["gps","GPS"],["tech","Technique"],["appat","Appât/leurre"],["mer","Mer"],["vent","Vent"],["eau","Eau"],["lune","Lune"],["notes","Notes"]];
 const val=(r,k)=>k==="esp"?spName(r):k==="zone"?zoneName(r):k==="tech"?techName(r):k==="garde"?(r.garde===false?"non":"oui"):(k==="taille"||k==="poids")?(r[k]==null?"":String(r[k]).replace(".",",")):(r[k]==null?"":r[k]);
 const cell=v=>{const s=String(v);return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const rows=C.rows.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 const csv="﻿"+[cols.map(c=>c[1]).join(";")].concat(rows.map(r=>cols.map(c=>cell(val(r,c[0]))).join(";"))).join("\r\n");
 const fname="carnet-peche-"+isoDate(new Date())+".csv";
 if(C.mode==="local"){downloadFile(fname,csv,"text/csv;charset=utf-8");toast("Fichier CSV téléchargé");return}
 const cl=window.claude;let dl=null;
 try{dl=cl&&typeof cl.use==="function"?await cl.use("downloads"):null}catch(e){dl=null}
 if(!dl){toast("Export indisponible dans cette vue");return}
 try{await dl.save({filename:fname,data:csv});toast("Fichier enregistré")}
 catch(e){if(e&&e.code==="declined")return;toast("Export impossible pour le moment")}
}
async function carnetInit(){
 try{
  const cl=window.claude;
  if(!cl||typeof cl.use!=="function"){initLocal();return}
  const res=await Promise.all([cl.use("db"),cl.use("user")]);const db=res[0],user=res[1];
  if(!db){C.state="unavailable";renderCarnet();return}
  C.db=db;
  const owner=user?await user.isOwner():false;
  if(!owner){C.state="readonly";renderCarnet();return}
  db.collection("carnet").onSnapshot(snap=>{
   C.rows=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
   if(C.state!=="ready"){C.state="ready";renderCarnet()}else renderCarnetList();
   renderHomeCarnet();
  },err=>{C.state="error";C.err=err&&err.code;renderCarnet();renderHomeCarnet()});
 }catch(e){C.state="unavailable";renderCarnet()}
}

 const spt=t.closest("[data-sptab]");if(spt){setSpTab(spt.dataset.sptab);return}
 const kt=t.closest("[data-ktab]");if(kt){setKTab(kt.dataset.ktab);return}
 const tf=t.closest("[data-tf]");if(tf){techFilter=tf.dataset.tf;$$("[data-tf]").forEach(b=>b.setAttribute("aria-pressed",b===tf));$$("#techList .tech").forEach(c=>{const ty=c.dataset.type;c.hidden=!(techFilter==="toutes"||ty===techFilter||ty==="deux")});return}
 const zf=t.closest("[data-zf]");if(zf){zoneFilter=zf.dataset.zf;$$("[data-zf]").forEach(b=>b.setAttribute("aria-pressed",b===zf));applyZoneFilter();return}
 if(t.closest("#zoomBtn")){const w=$("#mapWrap"),b=$("#zoomBtn");const on=!w.classList.contains("zoom");w.classList.toggle("zoom",on);b.setAttribute("aria-pressed",on);b.lastChild.textContent=on?"Réduire":"Agrandir";if(on){w.scrollLeft=(w.scrollWidth-w.clientWidth)*0.45;w.scrollTop=(w.scrollHeight-w.clientHeight)*0.3}return}
 const mk=t.closest("[data-mk]");if(mk){selectZone(mk.dataset.mk,true);return}
 const ru=t.closest("[data-ru]");if(ru){setRuler(+ru.dataset.ru);return}
 const ck=t.closest("[data-ck]");if(ck){ckMode=ck.dataset.ck;LS.set("ck-mode",ckMode);$$("[data-ck]").forEach(b=>b.setAttribute("aria-pressed",b===ck));renderCkList();return}
 if(t.closest("#ckReset")){CK[ckMode]={};LS.set("ck-state",CK);renderCkList();toast("Liste remise à zéro");return}
 const qo=t.closest(".q-opt");if(qo){answer(+qo.dataset.k);return}
 if(t.closest("#qNext")){clearTimeout(Q.timer);Q.i++;renderQuestion();return}
 if(t.closest("#qAgain")){quizStart();return}
 if(t.closest("#cNew")){openForm(null);return}
 if(t.closest("#cf-cancel")){closeForm();return}
 if(t.closest("#cExport")){exportCSV();return}
 if(t.closest("#cBackup")){if(!C.rows.length){toast("Rien à sauvegarder pour l'instant");return}backupJSON();return}
 const ed=t.closest("[data-edit]");if(ed){openForm(ed.dataset.edit);return}
 const dl=t.closest("[data-del]");if(dl){const c=document.querySelector('[data-confirm="'+CSS.escape(dl.dataset.del)+'"]');if(c)c.hidden=false;return}
 const dy=t.closest("[data-del-yes]");if(dy){deleteEntry(dy.dataset.delYes);return}
 const dn=t.closest("[data-del-no]");if(dn){const c=document.querySelector('[data-confirm="'+CSS.escape(dn.dataset.delNo)+'"]');if(c)c.hidden=true;return}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){closeSheet();closeDef()}
 if(e.target&&e.target.classList&&e.target.classList.contains("term")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openDef(+e.target.dataset.t,e.target);return}
 if(e.target&&e.target.id==="cRestoreLbl"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();const inp=$("#cRestore");if(inp)inp.click();return}
 const mk=e.target.closest&&e.target.closest("[data-mk]");
 if(mk&&(e.key==="Enter"||e.key===" ")){e.preventDefault();selectZone(mk.dataset.mk,true)}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.id==="spSearch"){spQuery=t.value;renderSpList()}
 else if(t.id==="glSearch"){glQuery=t.value;renderGlList()}
 else if(t.closest&&t.closest("#cForm"))updFormHints();
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.id==="cRestore"){restoreBackup(t.files&&t.files[0]);t.value="";return}
 if(t.matches("#ckList input[type=checkbox]")){const st=CK[ckMode]||(CK[ckMode]={});if(t.checked)st[t.dataset.key]=true;else delete st[t.dataset.key];LS.set("ck-state",CK);t.closest(".ck-item").classList.toggle("done",t.checked);updCk()}
 else if(t.closest&&t.closest("#cForm"))updFormHints();
});
document.addEventListener("submit",e=>{if(e.target.id==="cForm"){e.preventDefault();saveEntry()}});
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);go(id,PENDING);PENDING=null});
/* Image qui ne charge pas : on essaie l'adresse de secours, sinon on garde l'icône */
document.addEventListener("error",e=>{
 const img=e.target;if(!img||img.tagName!=="IMG")return;
 const fb=img.getAttribute("data-fb");
 if(fb&&fb!=="hide"){img.setAttribute("data-fb","hide");img.src=fb;return}
 img.remove();
},true);

renderNav();

renderNoeuds();

renderRegles();
renderChecklist();

renderSecurite();
renderGlossaire();
["accueil","especes","techniques","noeuds","zones","regles","materiel","securite"].forEach(id=>linkTerms($("#v-"+id)));
TERMS_READY=true;
go(location.hash.slice(1)||"accueil");
carnetInit();
})();
